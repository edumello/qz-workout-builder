<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QZ Workout Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Runna to QZ XML</h1>
    <p class="subtitle">Paste workout text from your calendar and generate treadmill XML.</p>

    <section class="panel">
      <div class="input-modes" role="tablist" aria-label="Workout input mode">
        <button id="modeTextBtn" class="mode-btn active" type="button" role="tab" aria-selected="true" data-mode="text">Runna Workout Text</button>
        <button id="modeImageBtn" class="mode-btn" type="button" role="tab" aria-selected="false" data-mode="image">Runna Workout Image</button>
        <button id="modeBuildBtn" class="mode-btn" type="button" role="tab" aria-selected="false" data-mode="build">Build your own</button>
      </div>

      <div id="textInputSection" class="mode-section active">
        <label for="workoutInput">Runna workout text</label>
        <textarea id="workoutInput" rows="12" placeholder="Paste workout text here..."></textarea>
      </div>

      <div id="imageInputSection" class="mode-section">
        <label for="workoutImageInput">Runna workout image</label>
        <input id="workoutImageInput" type="file" accept="image/*">
        <p class="mode-note">OCR parser is not implemented yet. This is the next step.</p>
      </div>

      <div id="buildInputSection" class="mode-section">
        <label for="buildInput">Build your own workout</label>
        <textarea id="buildInput" rows="8" placeholder="Builder mode coming soon..."></textarea>
        <p class="mode-note">Structured workout builder is not implemented yet.</p>
      </div>

      <div class="options">
        <div class="field">
          <label>Unit</label>
          <div class="unit-segment" role="radiogroup" aria-label="Unit">
            <input id="unitKm" name="unit" type="radio" value="km" checked>
            <input id="unitMiles" name="unit" type="radio" value="mi">
            <span class="unit-thumb" aria-hidden="true"></span>
            <label for="unitKm">km</label>
            <label for="unitMiles">miles</label>
          </div>
        </div>

        <div class="field">
          <label for="walkingTarget" id="walkingTargetLabel">Walking pace (mm:ss/km)</label>
          <input id="walkingTarget" type="text" value="15:00">
        </div>

        <div class="field">
          <label for="conversationalTarget" id="conversationalTargetLabel">Conversational pace (mm:ss/km)</label>
          <input id="conversationalTarget" type="text" value="8:06">
        </div>

        <div class="field">
          <label for="defaultIncline">Default incline % (optional)</label>
          <input id="defaultIncline" type="number" min="0" max="20" step="0.1" placeholder="e.g. 1.0">
        </div>
      </div>

      <div class="actions">
        <button id="parseBtn" type="button">Generate XML</button>
        <button id="downloadBtn" type="button" disabled>Download XML</button>
      </div>
    </section>

    <section class="panel">
      <h2>Parsed rows</h2>
      <div id="rowsOutput" class="rows-output"></div>
    </section>

    <section class="panel">
      <h2>XML output</h2>
      <textarea id="xmlOutput" rows="14" readonly></textarea>
      <p id="status" class="status"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
