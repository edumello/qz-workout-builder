<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QZ Workout Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Runna to QZ XML</h1>
    <p class="subtitle">Paste workout text from your calendar and generate treadmill XML.</p>

    <section class="panel">
      <label for="workoutInput">Runna workout text</label>
      <textarea id="workoutInput" rows="12" placeholder="Paste workout text here..."></textarea>

      <div class="options">
        <label for="unitMode">Target mode</label>
        <select id="unitMode">
          <option value="pace_km">PACE (km)</option>
          <option value="pace_mile">PACE (miles)</option>
          <option value="speed_kmh" selected>KMH</option>
          <option value="speed_mph">MILES</option>
        </select>

        <label for="walkingTarget" id="walkingTargetLabel">Walking speed (km/h)</label>
        <input id="walkingTarget" type="text" value="4.0">

        <label for="conversationalTarget" id="conversationalTargetLabel">Conversational pace (km/h)</label>
        <input id="conversationalTarget" type="text" value="7.4">

        <label for="defaultIncline">Default incline % (optional)</label>
        <input id="defaultIncline" type="number" min="0" max="20" step="0.1" placeholder="e.g. 1.0">
      </div>

      <div class="actions">
        <button id="parseBtn" type="button">Generate XML</button>
        <button id="downloadBtn" type="button" disabled>Download XML</button>
      </div>
    </section>

    <section class="panel">
      <h2>Parsed rows</h2>
      <div id="rowsOutput" class="rows-output"></div>
    </section>

    <section class="panel">
      <h2>XML output</h2>
      <textarea id="xmlOutput" rows="14" readonly></textarea>
      <p id="status" class="status"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
